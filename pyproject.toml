[project]
name = "apexvol-mcp"
version = "0.1.0"
description = "MCP server for ApexVol options analytics - query options data via Claude Code or Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ApexVol", email = "support@apexvol.com"}
]
maintainers = [
    {name = "ApexVol", email = "support@apexvol.com"}
]
keywords = ["mcp", "options", "analytics", "claude", "volatility", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://apexvol.com"
Documentation = "https://apexvol.com/docs/api"
"Source" = "https://github.com/ryansilk/apexvol-mcp"
"Issues" = "https://github.com/ryansilk/apexvol-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
apexvol-mcp = "apexvol_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexvol_mcp"]
